name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 결과가 쓸모없으므로 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # DB 없이 빠르게 끝나는 검사. 대부분의 실수는 여기서 걸러 Supabase를 띄우는 비용을 아낀다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 빌드는 환경 변수 값이 아니라 존재 여부와 정적 분석을 본다. 실제 키를 CI에 두지 않는다.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder

  # 실제 Postgres·Auth에 대고 권한과 전체 흐름을 검사한다. 클라우드 프로젝트 없이 러너 안에서 로컬 Supabase를 띄운다.
  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 로컬 Supabase 시작
        # 쓰지 않는 Studio를 빼서 이미지 다운로드 시간을 줄인다.
        run: npx supabase start -x studio
      - name: 생성 타입이 마이그레이션과 같은지 확인
        # 마이그레이션만 고치고 타입을 다시 만들지 않으면 코드는 통과해도 실제 스키마와 어긋난다.
        run: |
          npm run --silent db:types
          git diff --exit-code src/server/db/database.types.ts
      - name: 통합 테스트
        run: npm run test:integration
      - name: 앱 환경 변수 준비
        # 이 값은 러너 안에서만 쓰는 로컬 기본 키다.
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("/tmp/supabase-status.json", "utf8"));
            require("fs").writeFileSync(".env.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}`,
              `SUPABASE_SECRET_KEY=${s.SECRET_KEY}`,
              `FAKE_WEBHOOK_SECRET=ci-fake-webhook-secret`,
              `DEMO_SENDER_NUMBER=01000000000`,
              `TOSS_CLIENT_KEY=test_ck_ci`,
              `TOSS_SECRET_KEY=test_sk_ci`,
            ].join("\n"));
          '
      - run: npx playwright install --with-deps chromium
      - name: E2E 테스트
        run: npm run test:e2e
      - name: 실패 시 추적 파일 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
